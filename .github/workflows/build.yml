name: Build check

# Catches a broken build before Vercel does, and fails loudly on a dependency
# advisory so the project does not quietly drift into a vulnerable state —
# that is a due-diligence item if the site is ever sold.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC — weekly drift check
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # --include=dev is explicit on purpose: tailwind/postcss/typescript are
      # devDependencies but are required to produce the build, and any environment
      # with NODE_ENV=production omits them by default and fails the build.
      # Do NOT set NODE_ENV=development here — that breaks the React 19 build
      # with a null-dispatcher error. Install with dev deps, build in production.
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
